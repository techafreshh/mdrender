# Factory worker: every stage of the build runs inside this container.
services:
  worker:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ".:/app"
    init: true
    # The runtime/holdout scenarios probe the app through these published
    # ports, so a live instance must be listening behind each of them; sleep
    # infinity afterwards keeps the container up regardless of app health.
    command: ["sh", "-c", "PORT=8108 node server.js & PORT=8110 node server.js & exec sleep infinity"]
    ports:
      - "127.0.0.1:8108:8108"
      - "127.0.0.1:8110:8110"
